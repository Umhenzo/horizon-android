name: Build Horizon Android (LOD 32)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/lod-minimum-32
    paths:
      - "crates/horizon-client-render/src/graphics.rs"
      - "crates/horizon-client-render/src/graphics_ui.rs"
      - ".github/workflows/build-lod32-android.yml"

permissions:
  contents: read

concurrency:
  group: horizon-lod32-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_TARGET_DIR: .local/ci-target
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Gradle and apksigner use JDK 17. android_prepare.py downloads the
      # Minecraft-pinned JDK separately for generating the engine tables.
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          # "tools" is a removed SDK package. Installing it makes sdkmanager fail.
          packages: platform-tools

      - name: Install Android SDK, build tools and NDK
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358"

      - name: Install Rust 1.95 and Android target
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          target: aarch64-linux-android

      - name: Install Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Prepare verified Minecraft inputs and generated engine tables
        run: python tools/android_prepare.py

      - name: Build public ARM64 APK
        run: |
          python tools/android_build.py \
            --abi arm64-v8a \
            --public \
            --sdk "$ANDROID_HOME" \
            --java-home "$JAVA_HOME" \
            --gradle "$(command -v gradle)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: horizon-android-lod32-arm64
          path: .local/android/apk/arm64-v8a/horizon-android-public.apk
          if-no-files-found: error
          retention-days: 30
